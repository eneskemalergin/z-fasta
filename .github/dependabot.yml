version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      official-actions:
        patterns:
          - "actions/*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore"
