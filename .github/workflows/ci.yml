name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            binary: ./zig-out/bin/z-fasta
            target_flag: ""
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            binary: ./zig-out/bin/z-fasta
            target_flag: ""
          - name: Windows x86_64
            os: windows-latest
            binary: ./zig-out/bin/z-fasta.exe
            target_flag: ""
          # Zig 0.16.0 aarch64-windows host binary segfaults (bootstrap poison).
          # Use x86_64 Zig under WoA emulation and cross-build aarch64-windows so
          # smoke/tests still run native ARM binaries on the runner.
          # https://codeberg.org/ziglang/zig/issues/31865
          - name: Windows aarch64
            os: windows-11-arm
            binary: ./zig-out/bin/z-fasta.exe
            target_flag: "-Dtarget=aarch64-windows"
          - name: macOS aarch64
            os: macos-latest
            binary: ./zig-out/bin/z-fasta
            target_flag: ""
          - name: macOS x86_64
            os: macos-15-intel
            binary: ./zig-out/bin/z-fasta
            target_flag: ""

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Zig
        if: matrix.os != 'windows-11-arm'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: ${{ matrix.name }}

      - name: Setup Zig (Windows aarch64 host workaround)
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o zig.zip "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip"
          unzip -q zig.zip -d zig-sdk
          echo "$GITHUB_WORKSPACE/zig-sdk/zig-x86_64-windows-0.16.0" >> "$GITHUB_PATH"

      - name: Runner diagnostics
        shell: bash
        run: |
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "target_flag=${{ matrix.target_flag }}"
          zig version

      - name: Build
        shell: bash
        run: zig build ${{ matrix.target_flag }}

      - name: Build (ReleaseFast)
        shell: bash
        run: zig build -Doptimize=ReleaseFast ${{ matrix.target_flag }}

      - name: Smoke test
        shell: bash
        run: |
          if [[ ! -f "${{ matrix.binary }}" ]]; then
            echo "expected executable was not produced: ${{ matrix.binary }}" >&2
            ls -la zig-out/bin
            exit 1
          fi
          mkdir -p .ci-smoke
          printf '>seq1\nACGT\n>seq2\nGGGG\n' > .ci-smoke/test.fasta
          "${{ matrix.binary }}" --version
          "${{ matrix.binary }}" validate .ci-smoke/test.fasta > /dev/null
          "${{ matrix.binary }}" index .ci-smoke/test.fasta
          "${{ matrix.binary }}" index --emit-fai .ci-smoke/test.fasta > .ci-smoke/test.fai
          test -s .ci-smoke/test.fai
          "${{ matrix.binary }}" get .ci-smoke/test.fasta seq1:1-4 > .ci-smoke/get.out
          test -s .ci-smoke/get.out
          "${{ matrix.binary }}" stats .ci-smoke/test.fasta > .ci-smoke/stats.out
          test -s .ci-smoke/stats.out

      - name: Generate test indexes
        shell: bash
        run: |
          for f in \
            tests/data/simple.fasta \
            tests/data/proteome.fasta \
            tests/data/single.fasta \
            tests/data/edge_cases.fasta \
            tests/data/mixed_widths.fasta; do
            "${{ matrix.binary }}" index "$f"
          done

      - name: Run tests
        shell: bash
        run: zig build test --summary all ${{ matrix.target_flag }}
