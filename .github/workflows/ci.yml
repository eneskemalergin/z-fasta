name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Generate test indexes
        run: |
          for f in \
            tests/data/simple.fasta \
            tests/data/proteome.fasta \
            tests/data/single.fasta \
            tests/data/edge_cases.fasta \
            tests/data/mixed_widths.fasta; do
            ./zig-out/bin/z-fasta index "$f"
          done

      - name: Run tests
        run: zig build test

      - name: Smoke test
        run: |
          printf '>seq1\nACGT\n>seq2\nGGGG\n' > /tmp/test.fasta
          ./zig-out/bin/z-fasta --version
          ./zig-out/bin/z-fasta index --emit-fai /tmp/test.fasta
