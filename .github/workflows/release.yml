name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - system: linux_x86_64
            os: ubuntu-latest
            exe: z-fasta
            target_flag: ""
          - system: linux_arm64
            os: ubuntu-24.04-arm
            exe: z-fasta
            target_flag: ""
          - system: macos_x86_64
            os: macos-15-intel
            exe: z-fasta
            target_flag: ""
          - system: macos_arm64
            os: macos-latest
            exe: z-fasta
            target_flag: ""
          - system: windows_x86_64
            os: windows-latest
            exe: z-fasta.exe
            target_flag: ""
          # Zig 0.16.0 aarch64-windows host segfaults; cross-build like ci.yml.
          - system: windows_arm64
            os: windows-11-arm
            exe: z-fasta.exe
            target_flag: "-Dtarget=aarch64-windows"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Zig
        if: matrix.os != 'windows-11-arm'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: release-${{ matrix.system }}

      - name: Setup Zig (Windows arm64 host workaround)
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o zig.zip "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip"
          unzip -q zig.zip -d zig-sdk
          echo "$GITHUB_WORKSPACE/zig-sdk/zig-x86_64-windows-0.16.0" >> "$GITHUB_PATH"

      - name: Build ReleaseFast
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag must be vX.Y.Z, got: $tag" >&2
            exit 1
          }
          version="${tag#v}"
          zon=$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon | head -n1)
          main=$(sed -n 's/^const VERSION = "\([^"]*\)";.*/\1/p' src/main.zig | head -n1)
          [[ "$zon" == "$version" && "$main" == "$version" ]] || {
            echo "version mismatch: tag=$version zon=$zon main=$main" >&2
            exit 1
          }

          zig build -Doptimize=ReleaseFast ${{ matrix.target_flag }}

          bin="zig-out/bin/${{ matrix.exe }}"
          [[ -f "$bin" ]] || { ls -la zig-out/bin; exit 1; }
          got="$("$bin" --version)"
          [[ "$got" == "z-fasta ${version}" ]] || {
            echo "binary --version: got '$got'" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package and smoke
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          system="${{ matrix.system }}"
          exe="${{ matrix.exe }}"

          mkdir -p dist release-out
          cp "zig-out/bin/${exe}" "dist/${exe}"
          cp LICENSE dist/LICENSE

          if [[ "$exe" == *.exe ]]; then
            archive="z-fasta_${version}_${system}.zip"
            tar -C dist -a -cf "release-out/${archive}" "$exe" LICENSE
          else
            archive="z-fasta_${version}_${system}.tar.gz"
            chmod +x "dist/${exe}"
            tar -C dist -czf "release-out/${archive}" "$exe" LICENSE
          fi

          smoke="${RUNNER_TEMP}/z-fasta-smoke"
          rm -rf "$smoke" && mkdir -p "$smoke"
          tar -xf "release-out/${archive}" -C "$smoke"
          cd "$smoke"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export PATH="/usr/bin:/bin:${SYSTEMROOT}/System32"
          else
            export PATH="/usr/bin:/bin:/usr/local/bin"
          fi
          command -v zig >/dev/null 2>&1 && { echo "zig still on PATH" >&2; exit 1; }

          printf '>seq1\nACGT\n>seq2\nGGGG\n' > test.fasta
          "./${exe}" --help >/dev/null
          "./${exe}" --version
          "./${exe}" validate test.fasta >/dev/null
          "./${exe}" index test.fasta
          "./${exe}" index --emit-fai test.fasta > test.fai
          test -s test.fai
          "./${exe}" get test.fasta seq1:1-4 > get.out
          test -s get.out
          "./${exe}" stats test.fasta > stats.out
          test -s stats.out

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.system }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: artifacts
          merge-multiple: true

      - name: Checksums, notes, release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag must be vX.Y.Z, got: $tag" >&2
            exit 1
          }

          count=$(find artifacts -maxdepth 1 -type f | wc -l)
          [[ "$count" -eq 6 ]] || {
            echo "expected 6 archives, found ${count}" >&2
            ls -la artifacts || true
            exit 1
          }

          cd artifacts
          sha256sum z-fasta_"${version}"_* | sort -k2 > SHA256SUMS.txt
          [[ "$(wc -l < SHA256SUMS.txt)" -eq 6 ]]
          cd ..

          .github/scripts/changelog_section.sh CHANGELOG.md "$version" > notes.md
          [[ -s notes.md ]]

          gh release create "$tag" \
            --title "z-fasta ${version}" \
            --notes-file notes.md \
            artifacts/*
