name: Release

on:
  push:
    tags:
      # Glob (not regex): digits only, three components. Excludes v0.3.1-rc1 / vfoo.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Single version gate so the six-way matrix does not re-parse tag/zon/VERSION.
  gate:
    name: Version gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag matches package versions
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag must be vX.Y.Z, got: $tag" >&2
            exit 1
          }
          version="${tag#v}"
          zon=$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon | head -n1)
          main=$(sed -n 's/^const VERSION = "\([^"]*\)";.*/\1/p' src/main.zig | head -n1)
          [[ "$zon" == "$version" && "$main" == "$version" ]] || {
            echo "version mismatch: tag=$version zon=$zon main=$main" >&2
            exit 1
          }
          git fetch --no-tags origin main
          main_sha=$(git rev-parse origin/main)
          [[ "$GITHUB_SHA" == "$main_sha" ]] || {
            echo "release tag must point at current main: tag=$GITHUB_SHA main=$main_sha" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.system }})
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux_x86_64
            os: ubuntu-24.04
            exe: z-fasta
            target_flag: ""
          - system: linux_arm64
            os: ubuntu-24.04-arm
            exe: z-fasta
            target_flag: ""
          - system: macos_x86_64
            os: macos-15-intel
            exe: z-fasta
            target_flag: ""
          - system: macos_arm64
            os: macos-15
            exe: z-fasta
            target_flag: ""
          - system: windows_x86_64
            os: windows-2025
            exe: z-fasta.exe
            target_flag: ""
          # Zig 0.16.0 aarch64-windows host segfaults; cross-build like ci.yml.
          - system: windows_arm64
            os: windows-11-arm
            exe: z-fasta.exe
            target_flag: "-Dtarget=aarch64-windows"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Zig
        if: matrix.os != 'windows-11-arm'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Setup Zig (Windows arm64 host workaround)
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: .github/scripts/setup_zig_windows_arm.sh

      - name: Build ReleaseFast
        shell: bash
        run: zig build -Doptimize=ReleaseFast ${{ matrix.target_flag }}

      - name: Package and smoke
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SYSTEM: ${{ matrix.system }}
          EXE: ${{ matrix.exe }}
        run: .github/scripts/package_release.sh "$VERSION" "$SYSTEM" "$EXE"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.system }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: artifacts
          merge-multiple: true

      - name: Checksums, notes, release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$VERSION"

          count=$(find artifacts -maxdepth 1 -type f | wc -l)
          [[ "$count" -eq 6 ]] || {
            echo "expected 6 archives, found ${count}" >&2
            ls -la artifacts || true
            exit 1
          }
          expected=(
            "z-fasta_${version}_linux_x86_64.tar.gz"
            "z-fasta_${version}_linux_arm64.tar.gz"
            "z-fasta_${version}_macos_x86_64.tar.gz"
            "z-fasta_${version}_macos_arm64.tar.gz"
            "z-fasta_${version}_windows_x86_64.zip"
            "z-fasta_${version}_windows_arm64.zip"
          )
          for archive in "${expected[@]}"; do
            [[ -f "artifacts/${archive}" ]] || {
              echo "missing release archive: ${archive}" >&2
              exit 1
            }
          done

          cd artifacts
          sha256sum z-fasta_"${version}"_* | sort -k2 > SHA256SUMS.txt
          [[ "$(wc -l < SHA256SUMS.txt)" -eq 6 ]]
          cd ..

          .github/scripts/changelog_section.sh CHANGELOG.md "$version" > notes.md
          [[ -s notes.md ]]

          gh release create "$tag" \
            --title "z-fasta ${version}" \
            --notes-file notes.md \
            artifacts/*
